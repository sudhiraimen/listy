<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Listy</title>
<meta name="description" content="Lists of movies, shows, games and books to get to.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
:root{
  --bg:#ffffff; --surface:#f2f2f6; --surface-2:#e6e6eb; --raised:#ffffff;
  --sheet:#ffffff; --sheet-surface:#f1f1f5; --sheet-surface-2:#e3e3e8;
  --text:#0a0a0c; --text-2:#6b6b72; --text-3:#b9b9c0;
  --danger:#e5332a;
  --sep:rgba(60,60,67,.13); --glass:rgba(252,252,254,.8); --scrim:rgba(0,0,0,.32);
  --shadow:0 12px 32px rgba(0,0,0,.14);
  --accent:var(--cat-l,#1f6fe5); --on-accent:var(--on-l,#fff);
  --ambient-opacity:.55;
  --display:"Big Shoulders Display","Big Shoulders","Arial Narrow","Roboto Condensed",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1b1b1e; --surface-2:#2b2b2f; --raised:#56565c;
    --sheet:#18181b; --sheet-surface:#26262a; --sheet-surface-2:#353539;
    --text:#ffffff; --text-2:#8f8f96; --text-3:#4a4a4f;
    --danger:#ff5a52;
    --sep:rgba(255,255,255,.1); --glass:rgba(36,36,40,.78); --scrim:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.6);
    --accent:var(--cat-d,#4c9bff); --on-accent:var(--on-d,#fff);
    --ambient-opacity:.7;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
  font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,label.row{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.i{display:block;flex:none}

/* ambient glow: a heavily blurred cover behind the content */
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient img,.ambient .tint{position:absolute;left:-20%;top:-30%;width:140%;height:140%;object-fit:cover;filter:blur(48px) saturate(1.7);opacity:var(--ambient-opacity)}
.ambient .tint{background:radial-gradient(60% 60% at 30% 30%,var(--accent),transparent 70%);filter:blur(20px);opacity:.45}
.ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,color-mix(in srgb,var(--fade,var(--bg)) 55%,transparent) 55%,var(--fade,var(--bg)) 100%)}

/* top bars */
.bar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top, 0px) + 8px) 16px 10px;transition:background .2s,box-shadow .2s}
.bar.scrolled{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--sep)}
.bar-home{display:flex;align-items:center;justify-content:flex-end;min-height:62px}
.bar-home .bar-title{position:absolute;left:0;right:0;pointer-events:none}
.bar-list{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bar-title{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;margin:0 auto;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.bar.scrolled .bar-title{opacity:1;transform:none}
.bar-actions{display:flex;gap:10px;justify-content:flex-end}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .15s;
  background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.circle:active{transform:scale(.92)}

main{position:relative;max-width:1100px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom, 0px))}
main.home{max-width:720px}

/* big titles in the poster face */
.display{font-family:var(--display);font-weight:800;letter-spacing:.005em;line-height:.92;margin:0;overflow-wrap:anywhere}
.home-head{padding:2px 4px 18px}
.home-head .display{font-size:56px}
.home-sub{margin:6px 0 0;color:var(--text-2);font-size:15px}

/* home: list cards */
.lists{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:700px){.lists{grid-template-columns:1fr 1fr}}
.list-card{position:relative;isolation:isolate;display:flex;align-items:flex-end;gap:12px;width:100%;min-height:150px;padding:18px 16px 16px 18px;border-radius:24px;overflow:hidden;
  text-align:left;color:#fff;background:#141416;transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.list-card:active{transform:scale(.98)}
.list-card .ambient{--ambient-opacity:.95}
.list-card .ambient img{filter:blur(36px) saturate(1.8) brightness(.8)}
.list-card .ambient .tint{opacity:.9;background:radial-gradient(80% 90% at 15% 20%,var(--accent),transparent 75%)}
.list-card .ambient::after{background:linear-gradient(100deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.1) 100%)}
.list-card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);pointer-events:none}
.card-text{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cat-chip{display:grid;place-items:center;align-self:flex-start;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-bottom:auto}
.cat-chip .i{color:var(--cat-d)}
.card-name{font-size:34px;margin-top:22px;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.card-meta{font-size:14px;color:rgba(255,255,255,.78)}
.list-card .stack{position:relative;z-index:1;align-self:center;--w:56px;width:96px;height:100px}

/* fanned cover stacks */
.stack{display:block;position:relative;width:70px;height:74px;flex:none;--w:42px}
.stack-card{position:absolute;left:50%;bottom:4px;width:var(--w);aspect-ratio:var(--r,2/3);border-radius:7px;overflow:hidden;
  background:#2b2b2f;color:rgba(255,255,255,.7);display:grid;place-items:center;box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.35)}
.stack-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stack-card.s0{transform:translateX(-50%);z-index:3}
.stack-card.s1{transform:translateX(-12%) rotate(11deg);z-index:2;filter:brightness(.78)}
.stack-card.s2{transform:translateX(-88%) rotate(-11deg);z-index:1;filter:brightness(.62)}
.stack.big{--w:78px;width:160px;height:136px;margin:0 auto}
.stack.big .stack-card{border-radius:11px}
.stack.colors .stack-card{color:var(--on)}
.empty .stack:not(.colors) .stack-card{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);box-shadow:0 0 0 .5px var(--sep),0 8px 18px rgba(0,0,0,.12)}
.empty .stack:not(.colors) .s0{background:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.toolbar[hidden]{display:none}

/* progress */
.progress{display:block;height:4px;border-radius:2px;background:rgba(127,127,127,.28);overflow:hidden;max-width:220px}
.progress span{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .4s cubic-bezier(.2,.9,.3,1)}
.list-card .progress{max-width:150px;background:rgba(255,255,255,.22)}
.list-card .progress span{background:#fff}

/* list hero */
.hero{position:relative;margin:-110px 0 0;padding:120px 16px 6px}
.hero .ambient{bottom:-40px}
.hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.hero .display{font-size:52px}
.hero-meta{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:15px;color:var(--text-2)}
.hero-meta .progress{flex:1;max-width:160px}
.chips{display:flex;gap:8px;margin:20px 0 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:15px;font-weight:500;
  background:color-mix(in srgb,var(--surface) 75%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);transition:background .15s,color .15s}
.chip .n{margin-left:6px;color:var(--text-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 60%,transparent)}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 18px}}
#grid-wrap{padding-top:22px}
.cover{position:relative;display:block;width:100%;aspect-ratio:var(--ratio,2/3);border-radius:12px;overflow:hidden;background:var(--surface);color:var(--text-3);transition:transform .15s}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--sep);pointer-events:none}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center}
.tile .cover{box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
button.cover:active{transform:scale(.96)}
.done-mark{position:absolute;top:7px;right:7px;z-index:2;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tile.is-done .done-mark{transform:scale(1)}
.tile-title{margin-top:9px;font-size:15px;line-height:1.25;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-foot{display:flex;align-items:center;gap:8px;margin-top:3px}
.tile-rating{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:5px;padding:2px 0;font-size:13px;color:var(--text-2)}
.status .dot{width:13px;height:13px;border-radius:50%;border:1.3px solid var(--text-2);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.status.is-done{color:var(--accent)}
.status.is-done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status.pop .dot{animation:pop .35s ease-out}
@keyframes pop{40%{transform:scale(1.35)}}

/* bottom tools */
.toolbar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px) - var(--gap, 0px));z-index:30;height:56px;padding:0 6px;border-radius:28px;
  display:flex;align-items:center;gap:2px;background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep)}
.tb{width:48px;height:44px;border-radius:22px;display:grid;place-items:center;position:relative}
.tb.on{color:var(--accent)}
.tb.on::after{content:"";position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.toolbar.searching{right:92px;padding-left:16px;gap:8px;color:var(--text-2)}
.toolbar.searching input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--text);-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.fab{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom, 0px) - var(--gap, 0px));z-index:30;width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s}
.fab.neutral{background:var(--text);color:var(--bg);box-shadow:var(--shadow)}
.fab:active{transform:scale(.92)}

/* empty + hints */
.empty{text-align:center;padding:9vh 24px 0;max-width:360px;margin:0 auto}
.empty .display{font-size:40px;margin:30px 0 10px}
.empty p{margin:0 0 26px;color:var(--text-2);font-size:16px}
.btn-primary{height:50px;padding:0 26px;border-radius:25px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.btn-primary.neutral{background:var(--text);color:var(--bg)}
.hint{margin:0 auto;padding:44px 12px;max-width:34ch;text-align:center;color:var(--text-2);font-size:15px}
.spinner{width:22px;height:22px;margin:52px auto;border-radius:50%;border:2px solid var(--sep);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* menus */
.menu-scrim{position:fixed;inset:0 0 calc(-1 * var(--gap, 0px));z-index:60}
.menu{position:fixed;z-index:61;min-width:220px;max-width:290px;padding:6px;border-radius:18px;background:color-mix(in srgb,var(--surface) 94%,transparent);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep);animation:menuIn .18s ease-out}
@keyframes menuIn{from{opacity:0;transform:scale(.9)}}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:11px;font-size:16px;text-align:left}
.menu-item:active{background:var(--surface-2)}
@media (hover:hover){.menu-item:hover{background:var(--surface-2)}}
.menu-item .menu-text{flex:1}
.menu-item .chk{width:16px;color:var(--accent)}
.menu-item.danger{color:var(--danger)}
.menu-sep{height:1px;margin:5px 10px;background:var(--sep)}
.menu-label{padding:8px 12px 4px;font-size:13px;color:var(--text-2)}

/* sheets */
.sheet-wrap{position:fixed;inset:0 0 calc(-1 * var(--gap, 0px));z-index:50}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s ease-out}
.closing .sheet-scrim{animation:fadeOut .25s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{--surface:var(--sheet-surface);--surface-2:var(--sheet-surface-2);--fade:var(--sheet);
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:calc(100dvh + var(--gap, 0px) - env(safe-area-inset-top, 0px) - 10px);
  display:flex;flex-direction:column;background:var(--sheet);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom, 0px);overflow:hidden;isolation:isolate;
  animation:up .36s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.tall{height:calc(100dvh + var(--gap, 0px) - env(safe-area-inset-top, 0px) - 10px)}
@keyframes up{from{transform:translateY(100%)}}
@media (min-width:700px){
  .sheet{bottom:24px;border-radius:26px;max-height:calc(100dvh - 48px)}
  .sheet.tall{height:min(780px,calc(100dvh - 48px))}
}
.sheet>.ambient{bottom:auto;height:440px}
.sheet-drag{position:relative;z-index:1;touch-action:none;flex:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--text-3);margin:6px auto 0}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:48px;padding:2px 16px 6px}
.sheet-head h2{margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.01em;text-align:center}
.sheet-head .end{display:flex;justify-content:flex-end}
.text-btn{color:var(--accent);font-size:17px;padding:8px 0}
.text-btn.strong{font-weight:600}
.sheet-x{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--text-2);display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet-body{position:relative;z-index:1;flex:1;overflow:auto;padding:4px 16px 28px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sticky-top{position:sticky;top:-4px;z-index:2;background:var(--sheet);padding:4px 0 14px}
.search-field{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:14px;background:var(--surface);color:var(--text-2);cursor:text}
.search-field:focus-within{box-shadow:0 0 0 2px var(--accent)}
.search-field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--text);-webkit-appearance:none;appearance:none}
.search-field .clear{color:var(--text-3);display:grid;place-items:center;padding:4px}
.search-field .clear[hidden]{display:none}
.results-grid{gap:18px 10px}
.result{display:block;text-align:left;min-width:0}
.result .cover{transition:transform .15s}
.result:active .cover{transform:scale(.96)}
.r-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:7px;font-size:14px;line-height:1.25;font-weight:500}
.r-meta{display:block;margin-top:2px;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:6px;right:6px;z-index:2;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.result.added .badge{transform:scale(1)}
.result.added img{opacity:.5}
.section-label{margin:4px 2px 10px;font-size:13px;color:var(--text-2)}
.grid+.section-label{margin-top:28px}
.row{color:inherit;text-decoration:none}
.add-plain{display:flex;align-items:center;gap:10px;width:100%;margin-top:26px;padding:14px;border-radius:14px;background:var(--surface);color:var(--accent);font-size:16px;text-align:left}
.add-plain span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forms */
.field{width:100%;height:52px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);font-size:17px;outline:none}
.field:focus{box-shadow:0 0 0 2px var(--accent)}
.field.big{font-family:var(--display);font-weight:800;font-size:30px;height:62px;letter-spacing:.01em}
.field.big::placeholder{color:var(--text-3)}
.field-label{margin:22px 4px 8px;font-size:13px;color:var(--text-2)}
.field-help{margin:14px 4px 0;font-size:13px;color:var(--text-2)}
.cat{--c:var(--cat-l);--on:var(--on-l)}
@media (prefers-color-scheme: dark){.cat{--c:var(--cat-d);--on:var(--on-d)}}
.list-card{--accent:var(--cat-d)}
.detail-title{resize:none;overflow:hidden;display:block;font-family:var(--display)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;background:var(--surface);color:var(--text);font-size:14px;font-weight:500;
  box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.cat .swatch{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.cat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.cat[aria-pressed="true"] .swatch{background:var(--c);color:var(--on)}

/* item detail */
.detail{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.detail-cover{width:min(190px,50vw);border-radius:14px;box-shadow:0 22px 44px -12px rgba(0,0,0,.55),0 0 0 .5px var(--sep)}
.detail-title{width:100%;margin-top:22px;padding:4px 8px;border:0;border-radius:10px;background:none;text-align:center;
  font-family:var(--display);font-size:36px;line-height:1;font-weight:800;letter-spacing:.01em;outline:none}
.detail-title:focus{background:var(--surface)}
.detail-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin:6px 0 0;font-size:15px;color:var(--text-2)}
.detail-meta:empty{display:none}
.segmented{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:340px;margin-top:22px;padding:3px;border-radius:14px;background:var(--surface)}
.seg{height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--text-2);transition:background .2s,color .2s}
.seg[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg[data-d="done"][aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stars{display:flex;gap:4px;margin-top:16px}
.star{padding:4px;color:var(--text-3);transition:transform .15s}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.star:active{transform:scale(.85)}
.note{width:100%;min-height:92px;margin-top:20px;padding:12px 14px;border:0;border-radius:14px;background:var(--surface);font-size:16px;line-height:1.4;resize:vertical;outline:none;text-align:left}
.group{width:100%;margin-top:14px;border-radius:14px;background:var(--surface);overflow:hidden;text-align:left}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;font-size:16px;text-align:left}
.row+.row{border-top:1px solid var(--sep)}
.row .i{color:var(--accent)}
.row.danger,.row.danger .i{color:var(--danger)}
.cover-actions{margin:0 0 22px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom, 0px) - var(--gap, 0px));z-index:80;max-width:calc(100% - 48px);padding:10px 18px;border-radius:22px;
  background:var(--text);color:var(--bg);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translate(-50%,10px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app"></div>
<noscript><p class="hint">Listy needs JavaScript to run.</p></noscript>
<script>
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const yr = s => (String(s || '').match(/\b(1[89]|20)\d{2}\b/) || [''])[0];
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

const ICONS = {
  back:'<path d="M15 4.5 7.5 12l7.5 7.5"/>',
  share:'<path d="M12 15V3.5M8 7l4-4 4 4"/><path d="M8.5 10H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1.5"/>',
  more:'<circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="M5 12.5 9.5 17 19 7.5"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/>',
  sort:'<path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4M13.5 16.5 17 20l3.5-3.5"/>',
  film:'<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M7.5 3.5v17M16.5 3.5v17M3.5 8.5h4M3.5 15.5h4M16.5 8.5h4M16.5 15.5h4"/>',
  tv:'<rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="m8.5 2.5 3.5 3.5 3.5-3.5"/>',
  game:'<path d="M7.5 7h9a5 5 0 0 1 4.9 6l-.6 3.2a2.6 2.6 0 0 1-4.5 1.2L14.5 15h-5l-1.8 2.4a2.6 2.6 0 0 1-4.5-1.2L2.6 13a5 5 0 0 1 4.9-6z"/><path d="M8 9.8v3.4M6.3 11.5h3.4"/><path d="M15.5 10.5h.01M17.5 12.5h.01" stroke-width="2.6"/>',
  book:'<path d="M4.5 5.5a2 2 0 0 1 2-2h12v14h-12a2 2 0 0 0-2 2z"/><path d="M4.5 19.5a2 2 0 0 0 2 2h12v-4"/>',
  music:'<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  anime:'<path d="M12 3l2 6.5 6.5 2.5-6.5 2.5L12 21l-2-6.5L3.5 12 10 9.5z"/>',
  bookmark:'<path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>',
  star:'<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
  image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 15.5-4.5-4.5-8.5 8.5"/>',
  upload:'<path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4.5 14v4a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/>',
  download:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 14v4a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  trash:'<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/>',
  pencil:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',
  tag:'<path d="M3.5 12V3.5H12l8.5 8.5-8.5 8.5z"/><circle cx="8" cy="8" r="1.4"/>',
  move:'<path d="M4 7h12M12 3l4 4-4 4M20 17H8M12 13l-4 4 4 4"/>',
  xcircle:'<circle cx="12" cy="12" r="9" fill="currentColor" stroke="none"/><path d="m9 9 6 6M15 9l-6 6" stroke="var(--surface)"/>'
};
const icon = (n, s = 22, w = 1.8) =>
  `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- cover sources (all free, no API key) ---------- */
async function getJSON(url, signal) {
  const r = await fetch(url, { signal });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const P = {
  async itunes(q, media, entity, size, signal) {
    const d = await getJSON(`https://itunes.apple.com/search?term=${enc(q)}&media=${media}&entity=${entity}&limit=18`, signal);
    return (d.results || []).filter(r => r.artworkUrl100).map(r => ({
      title: r.trackName || r.collectionName, year: yr(r.releaseDate), sub: r.artistName || '',
      cover: r.artworkUrl100.replace(/\/\d+x\d+bb\./, `/${size}bb.`)
    }));
  },
  async tvmaze(q, signal) {
    const d = await getJSON(`https://api.tvmaze.com/search/shows?q=${enc(q)}`, signal);
    return d.map(x => x.show).filter(s => s && s.image).map(s => ({
      title: s.name, year: yr(s.premiered), sub: (s.network && s.network.name) || (s.webChannel && s.webChannel.name) || '',
      cover: (s.image.original || s.image.medium).replace(/^http:/, 'https:')
    }));
  },
  async jikan(q, signal) {
    const d = await getJSON(`https://api.jikan.moe/v4/anime?q=${enc(q)}&limit=18&sfw=true`, signal);
    return (d.data || []).map(a => ({
      title: a.title_english || a.title, year: String(a.year || yr(a.aired && a.aired.from) || ''), sub: a.type || '',
      cover: (a.images && ((a.images.webp && a.images.webp.large_image_url) || (a.images.jpg && a.images.jpg.large_image_url))) || ''
    })).filter(a => a.cover);
  },
  async openlibrary(q, signal) {
    const d = await getJSON(`https://openlibrary.org/search.json?q=${enc(q)}&limit=24&fields=title,author_name,first_publish_year,cover_i`, signal);
    return (d.docs || []).filter(b => b.cover_i).map(b => ({
      title: b.title, year: b.first_publish_year ? String(b.first_publish_year) : '', sub: (b.author_name || [])[0] || '',
      cover: `https://covers.openlibrary.org/b/id/${b.cover_i}-L.jpg`
    }));
  },
  async wiki(q, hint, prefer, signal) {
    const term = hint ? `${q} ${hint}` : q;
    const d = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&generator=search&gsrsearch=${enc(term)}&gsrlimit=15&prop=pageimages|description&piprop=thumbnail&pithumbsize=600&pilicense=any`, signal);
    let pages = ((d.query && d.query.pages) || []).filter(p => p.thumbnail).sort((a, b) => a.index - b.index);
    if (prefer) { const m = pages.filter(p => prefer.test(p.description || '')); if (m.length) pages = m; }
    return pages.map(p => ({ title: p.title.replace(/\s*\([^)]*\)$/, ''), year: yr(p.description), sub: p.description || '', cover: p.thumbnail.source }));
  }
};

const CATS = {
  movie: { label:'Movies',   one:'movie', a:'a movie',  many:'movies', done:'Watched',  icon:'film',     ratio:'2/3',
           sources:[(q,s)=>P.itunes(q,'movie','movie','600x900',s), (q,s)=>P.wiki(q,'film',/film|movie/i,s)] },
  tv:    { label:'TV shows', one:'show',  a:'a show',   many:'shows',  done:'Watched',  icon:'tv',       ratio:'2/3',
           sources:[P.tvmaze, (q,s)=>P.wiki(q,'TV series',/series|television|sitcom|show/i,s)] },
  game:  { label:'Games',    one:'game',  a:'a game',   many:'games',  done:'Played',   icon:'game',     ratio:'2/3',
           sources:[(q,s)=>P.wiki(q,'video game',/game/i,s), (q,s)=>P.itunes(q,'software','software','600x600',s)] },
  book:  { label:'Books',    one:'book',  a:'a book',   many:'books',  done:'Read',     icon:'book',     ratio:'2/3',
           sources:[P.openlibrary, (q,s)=>P.wiki(q,'novel',/novel|book/i,s)] },
  music: { label:'Albums',   one:'album', a:'an album', many:'albums', done:'Listened', icon:'music',    ratio:'1/1',
           sources:[(q,s)=>P.itunes(q,'music','album','600x600',s), (q,s)=>P.wiki(q,'album',/album/i,s)] },
  anime: { label:'Anime',    one:'anime', a:'an anime', many:'anime',  done:'Watched',  icon:'anime',    ratio:'2/3',
           sources:[P.jikan, (q,s)=>P.wiki(q,'anime',/anime|manga/i,s)] },
  other: { label:'Other',    one:'item',  a:'an item',  many:'items',  done:'Done',     icon:'bookmark', ratio:'2/3',
           sources:[(q,s)=>P.wiki(q,'',null,s)] }
};
const cat = l => CATS[l && l.category] || CATS.other;

const coverCache = new Map();
async function findCovers(category, q, signal) {
  const key = category + '|' + q.toLowerCase();
  if (coverCache.has(key)) return coverCache.get(key);
  let res = [], lastErr = null;
  for (const src of (CATS[category] || CATS.other).sources) {
    try {
      const seen = new Set();
      res = (await src(q, signal)).filter(r => r.title && r.cover && !seen.has(r.cover) && seen.add(r.cover));
      if (res.length) break;
    } catch (e) { if (e.name === 'AbortError') throw e; lastErr = e; }
  }
  if (!res.length && lastErr) throw lastErr;
  coverCache.set(key, res);
  return res;
}

/* ---------- covers from a pasted link ---------- */
const findLink = s => { const m = String(s || '').match(/https?:\/\/[^\s<>"']+|(?:^|\s)(www\.[^\s<>"']+)/i); return m ? (m[1] ? 'https://' + m[1] : m[0]).replace(/[),.;]+$/, '') : null; };
const hostOf = u => { try { return new URL(u).hostname.replace(/^(www|m|mobile)\./, ''); } catch { return ''; } };
const imageOK = (src, ms = 6000) => new Promise(res => {
  const img = new Image(); let done = false;
  const fin = ok => { if (!done) { done = true; res(ok && img.naturalWidth > 1); } };
  img.onload = () => fin(true); img.onerror = () => fin(false); setTimeout(() => fin(false), ms);
  img.referrerPolicy = 'no-referrer'; img.src = src;
});

// Turn page titles like "Interstellar (2014) - IMDb" into a clean title + year.
function cleanTitle(raw) {
  let t = String(raw || '').replace(/[\u200e\u200f]/g, '').trim(), year = '';
  const steam = t.match(/^(?:Save \d+% on )?(.+?) on Steam$/i);
  if (steam) t = steam[1];
  t = t.replace(/^Amazon\.[\w.]+:\s*/i, '');
  t = t.split(/\s+[|•·]\s+/)[0];
  t = t.replace(/\s+[-–—]\s+[^-–—]{1,30}$/, '');
  t = t.replace(/\s*\([^)]*#\d+[^)]*\)$/, '').replace(/\s*⭐.*$/, '').replace(/\s+directed by .*$/i, '');
  if (/netflix|prime video|disney\+|hulu|hbo|apple tv/i.test(raw)) t = t.replace(/^Watch\s+/i, '');
  const y = t.match(/\s*\(([^)]*?\b((?:1[89]|20)\d\d)\b[^)]*)\)/);
  if (y) { year = y[2]; t = t.replace(y[0], ''); }
  return { title: t.trim(), year };
}

async function wikiPage(title, signal, host = 'en.wikipedia.org') {
  const d = await getJSON(`https://${host}/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&titles=${enc(title)}&prop=pageimages|description&piprop=thumbnail&pithumbsize=600&pilicense=any`, signal);
  const p = d.query && d.query.pages && d.query.pages[0];
  if (!p || p.missing) return null;
  return { title: p.title.replace(/\s*\([^)]*\)$/, ''), year: yr(p.description), sub: p.description || '', cover: p.thumbnail ? p.thumbnail.source : '' };
}

// Sites we can read directly through their own free APIs (no third party needed).
const LINK_SOURCES = [
  { match: (h, u) => h.endsWith('imdb.com') && /\/title\/(tt\d+)/.test(u.pathname), async get(u, signal) {
      const tt = u.pathname.match(/\/title\/(tt\d+)/)[1];
      const s = await getJSON(`https://www.wikidata.org/w/api.php?action=query&list=search&srsearch=haswbstatement:P345=${tt}&format=json&origin=*`, signal);
      const q = s.query && s.query.search && s.query.search[0] && s.query.search[0].title;
      if (!q) return null;
      const e = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${q}&props=sitelinks|labels&sitefilter=enwiki&languages=en&format=json&origin=*`, signal);
      const ent = e.entities && e.entities[q];
      const wt = ent && ent.sitelinks && ent.sitelinks.enwiki && ent.sitelinks.enwiki.title;
      const w = wt ? await wikiPage(wt, signal) : null;
      const label = ent && ent.labels && ent.labels.en && ent.labels.en.value;
      return w ? { ...w, title: label || w.title } : null;
  } },
  { match: h => h.endsWith('wikipedia.org'), async get(u, signal) {
      const m = u.pathname.match(/\/wiki\/(.+)/);
      return m ? wikiPage(decodeURIComponent(m[1]).replace(/_/g, ' '), signal, u.hostname.replace('.m.', '.')) : null;
  } },
  { match: (h, u) => h === 'store.steampowered.com' && /\/app\/\d+/.test(u.pathname), async get(u, signal) {
      const m = u.pathname.match(/\/app\/(\d+)(?:\/([^/?#]+))?/);
      const id = m[1];
      const tries = [`https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/library_600x900_2x.jpg`,
        `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/library_600x900.jpg`,
        `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/library_600x900.jpg`,
        `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`];
      for (const src of tries) {
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        if (await imageOK(src)) return { title: m[2] ? decodeURIComponent(m[2]).replace(/_/g, ' ') : '', cover: src };
      }
      return null;
  } },
  { match: h => h.endsWith('tvmaze.com'), async get(u, signal) {
      const m = u.pathname.match(/\/shows\/(\d+)/);
      if (!m) return null;
      const s = await getJSON(`https://api.tvmaze.com/shows/${m[1]}`, signal);
      return { title: s.name, year: yr(s.premiered), cover: s.image ? (s.image.original || s.image.medium).replace(/^http:/, 'https:') : '' };
  } },
  { match: h => h.endsWith('myanimelist.net'), async get(u, signal) {
      const m = u.pathname.match(/\/anime\/(\d+)/);
      if (!m) return null;
      const a = (await getJSON(`https://api.jikan.moe/v4/anime/${m[1]}`, signal)).data;
      return a && { title: a.title_english || a.title, year: String(a.year || yr(a.aired && a.aired.from) || ''), cover: a.images.jpg.large_image_url };
  } },
  { match: h => h.endsWith('openlibrary.org'), async get(u, signal) {
      const m = u.pathname.match(/\/(works|books)\/(OL\w+)/);
      if (!m) return null;
      const b = await getJSON(`https://openlibrary.org/${m[1]}/${m[2]}.json`, signal);
      return { title: b.title, year: yr(b.first_publish_date || b.publish_date), cover: b.covers && b.covers[0] > 0 ? `https://covers.openlibrary.org/b/id/${b.covers[0]}-L.jpg` : '' };
  } },
  { match: h => h.endsWith('apple.com'), async get(u, signal) {
      const m = u.pathname.match(/\/id(\d+)/) || u.pathname.match(/\/(\d{6,})\/?$/);
      if (!m) return null;
      const r = (await getJSON(`https://itunes.apple.com/lookup?id=${m[1]}`, signal)).results[0];
      if (!r || !r.artworkUrl100) return null;
      const size = r.kind === 'feature-movie' ? '600x900' : '600x600';
      return { title: r.trackName || r.collectionName, year: yr(r.releaseDate), sub: r.artistName || '', cover: r.artworkUrl100.replace(/\/\d+x\d+bb\./, `/${size}bb.`) };
  } }
];

// Any other site: read its preview image (og:image), the same one used for link previews in chat apps.
async function pageMeta(url, signal) {
  try {
    const d = await getJSON(`https://api.microlink.io/?url=${enc(url)}`, signal);
    if (d.status === 'success' && d.data) return { ...cleanTitle(d.data.title), cover: (d.data.image && d.data.image.url) || '' };
  } catch (e) { if (e.name === 'AbortError') throw e; }
  const d = await getJSON(`https://api.allorigins.win/get?url=${enc(url)}`, signal);
  const doc = new DOMParser().parseFromString(d.contents || '', 'text/html');
  const meta = n => { const el = doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`); return el ? el.getAttribute('content') || '' : ''; };
  const img = meta('og:image') || meta('og:image:url') || meta('twitter:image');
  return { ...cleanTitle(meta('og:title') || meta('twitter:title') || doc.title), cover: img ? new URL(img, url).href : '' };
}

async function fromLink(href, signal) {
  const u = new URL(href), h = hostOf(href);
  if (/\.(jpe?g|png|webp|gif|avif)$/i.test(u.pathname)) return { title: '', year: '', cover: u.href, link: u.href, host: h };
  let r = null;
  for (const src of LINK_SOURCES) {
    if (!src.match(h, u)) continue;
    try { r = await src.get(u, signal); } catch (e) { if (e.name === 'AbortError') throw e; }
    break;
  }
  if (!r || !r.cover) {
    const m = await pageMeta(u.href, signal);
    r = { ...m, ...(r || {}), cover: (r && r.cover) || m.cover, title: (r && r.title) || m.title };
  }
  return { title: r.title || '', year: r.year || '', sub: r.sub || '', cover: r.cover || '', link: u.href, host: h };
}

/* ---------- storage ---------- */
const KEY = 'shelf.v1';
let storageOK = true;
let db = (() => {
  let raw = null;
  try { raw = localStorage.getItem(KEY); const d = JSON.parse(raw); if (d && Array.isArray(d.lists)) return d; }
  catch (e) {
    if (e.name === 'SecurityError') storageOK = false;
    else if (raw) try { localStorage.setItem(KEY + '.unreadable', raw); } catch {}
  }
  return { lists: [] };
})();
function save() {
  if (!storageOK) return true; // storage blocked (e.g. a sandboxed preview): keep working in memory
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) {
    if (e.name === 'SecurityError') { storageOK = false; return true; }
    toast('Storage is full. Remove some uploaded covers.'); return false;
  }
}
const getList = id => db.lists.find(l => l.id === id);

/* ---------- state + routing ---------- */
const app = $('#app');
const ui = { filter: 'all', query: '', searching: false };
let current = null, homeScroll = 0;
let hash = location.hash; // tracked in memory too, so navigation works where the History API is blocked

function route() {
  closeMenu();
  while (sheets.length) sheets[sheets.length - 1].close(true);
  const m = hash.match(/^#list-(\w+)$/);
  const l = m && getList(m[1]);
  if (l) {
    if (current !== l.id) Object.assign(ui, { filter: 'all', query: '', searching: false });
    current = l.id; renderList(l);
  } else {
    current = null; renderHome(); requestAnimationFrame(() => scrollTo(0, homeScroll));
  }
}
let historyOK = true;
function go(h) {
  // Remove any open popup first and let the screen repaint before navigating.
  // iPhones save a screenshot of the page when you leave it and show it again on the way back,
  // so a popup that's still on screen at this moment would reappear when returning.
  closeMenu();
  const hadSheet = sheets.length > 0;
  while (sheets.length) sheets[sheets.length - 1].close(true);
  const nav = () => {
    hash = h;
    try { history.pushState({ app: true }, '', h); } catch { historyOK = false; }
    route(); scrollTo(0, 0);
  };
  if (hadSheet) requestAnimationFrame(() => requestAnimationFrame(nav)); else nav();
}
function back() {
  let st = null;
  try { st = history.state; } catch {}
  if (historyOK && st && st.app) { history.back(); return; }
  hash = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  route();
}
addEventListener('popstate', () => { hash = location.hash; route(); });
try { history.scrollRestoration = 'manual'; } catch {}

/* ---------- shared bits ---------- */
// Each category has its own color, tuned separately for dark (d) and light (l) mode.
const COLORS = {
  movie: { d:'#ff5a52', l:'#e0322a', od:'#fff',    ol:'#fff' },
  tv:    { d:'#4c9bff', l:'#1f6fe5', od:'#fff',    ol:'#fff' },
  game:  { d:'#3dd68c', l:'#12925a', od:'#04170d', ol:'#fff' },
  book:  { d:'#ffb224', l:'#b87300', od:'#1f1400', ol:'#fff' },
  music: { d:'#c77dff', l:'#8f3dd4', od:'#fff',    ol:'#fff' },
  anime: { d:'#ff7eb6', l:'#d23a80', od:'#2a0414', ol:'#fff' },
  other: { d:'#8c9eff', l:'#4e5fd6', od:'#fff',    ol:'#fff' }
};
const catVars = key => { const k = COLORS[key] || COLORS.other; return `--cat-d:${k.d};--cat-l:${k.l};--on-d:${k.od};--on-l:${k.ol}`; };
function setAccent(key) {
  const root = document.documentElement.style;
  if (!key) { ['--cat-d', '--cat-l', '--on-d', '--on-l'].forEach(v => root.removeProperty(v)); return; }
  const k = COLORS[key] || COLORS.other;
  root.setProperty('--cat-d', k.d); root.setProperty('--cat-l', k.l); root.setProperty('--on-d', k.od); root.setProperty('--on-l', k.ol);
}
const ambientHTML = cover => `<span class="ambient" aria-hidden="true">${cover
  ? `<img src="${esc(cover)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;tint&quot;></span>'">`
  : '<span class="tint"></span>'}</span>`;
const newest = l => [...l.items].sort((a, b) => b.added - a.added);
const firstCover = items => (items.find(i => i.cover) || {}).cover || '';

function coverHTML(item, c, size = 28) {
  return `<span class="ph">${icon(c.icon, size, 1.5)}</span>` +
    (item.cover ? `<img src="${esc(item.cover)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : '');
}
function stackHTML(items, c, big) {
  return `<span class="stack${big ? ' big' : ''}" style="--r:${c.ratio}" aria-hidden="true">${[2, 1, 0].map(k => {
    const it = items[k];
    const inner = it && it.cover
      ? `<img src="${esc(it.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
      : (k === 0 ? icon(c.icon, big ? 30 : 20, 1.5) : '');
    return `<span class="stack-card s${k}">${inner}</span>`;
  }).join('')}</span>`;
}
const doneCount = l => l.items.filter(i => i.status === 'done').length;
function countLine(l) {
  const c = cat(l), n = l.items.length;
  if (!n) return `No ${c.many} yet`;
  return `${doneCount(l)} of ${n} ${c.done.toLowerCase()}`;
}
const progressHTML = l => `<span class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${l.items.length}" aria-valuenow="${doneCount(l)}"><span style="width:${l.items.length ? Math.round(doneCount(l) / l.items.length * 100) : 0}%"></span></span>`;

// Show the small title in the top bar once the big one scrolls away.
function watchScroll() {
  const bar = $('.bar');
  if (bar) bar.classList.toggle('scrolled', scrollY > (current ? 96 : 54));
}
addEventListener('scroll', watchScroll, { passive: true });

/* ---------- list ---------- */
function renderList(l) {
  const c = cat(l);
  document.title = l.name;
  setAccent(l.category);
  app.innerHTML = `
    <header class="bar bar-list">
      <div><button class="circle" data-act="back" aria-label="Back to lists">${icon('back')}</button></div>
      <h1 class="bar-title">${esc(l.name)}</h1>
      <div class="bar-actions">
        <button class="circle" data-act="share-list" aria-label="Share list">${icon('share')}</button>
        <button class="circle" data-act="list-menu" aria-label="List options">${icon('more')}</button>
      </div>
    </header>
    <section class="hero" id="hero"></section>
    <main id="grid-wrap" style="--ratio:${c.ratio}"></main>
    <nav class="toolbar" id="toolbar" aria-label="Sort and search"></nav>
    <button class="fab" data-act="add" aria-label="Add ${c.one}">${icon('plus', 28, 2.2)}</button>`;
  renderToolbar();

}

function renderHero(l) {
  const hero = $('#hero');
  if (!hero) return;
  const c = cat(l), n = l.items.length, d = doneCount(l), cover = firstCover(newest(l));
  if (hero.dataset.cover !== cover || !hero.firstElementChild) {
    hero.dataset.cover = cover;
    hero.innerHTML = ambientHTML(cover) + '<div class="hero-inner"></div>';
  }
  hero.lastElementChild.innerHTML = `
      <h2 class="display">${esc(l.name)}</h2>
      ${n ? `<div class="hero-meta"><span>${countLine(l)}</span>${progressHTML(l)}</div>
      <div class="chips" role="group" aria-label="Show">
        ${[['all', 'All', n], ['pending', 'Pending', n - d], ['done', c.done, d]].map(([k, label, count]) =>
          `<button class="chip" data-act="chip" data-f="${k}" aria-pressed="${ui.filter === k}">${label}<span class="n">${count}</span></button>`).join('')}
      </div>` : ''}`;
}

function visibleItems(l, all = false) {
  let it = l.items;
  if (!all && ui.filter !== 'all') it = it.filter(i => i.status === ui.filter);
  const q = all ? '' : ui.query.trim().toLowerCase();
  if (q) it = it.filter(i => i.title.toLowerCase().includes(q));
  const by = {
    added: (a, b) => b.added - a.added,
    title: (a, b) => collator.compare(a.title, b.title),
    year: (a, b) => (+b.year || 0) - (+a.year || 0) || collator.compare(a.title, b.title),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || b.added - a.added
  };
  return [...it].sort(by[l.sort] || by.added);
}

function tileHTML(i, c) {
  const done = i.status === 'done';
  return `<div class="tile${done ? ' is-done' : ''}">
    <button class="cover" data-act="open-item" data-id="${i.id}" aria-label="${esc(i.title)}">${coverHTML(i, c)}<span class="done-mark">${icon('check', 14, 3)}</span></button>
    <div class="tile-title">${esc(i.title)}</div>
    <div class="tile-foot">
      <button class="status${done ? ' is-done' : ''}" data-act="toggle" data-id="${i.id}" aria-pressed="${done}" aria-label="Mark ${esc(i.title)} as ${done ? 'pending' : c.done.toLowerCase()}"><span class="dot">${icon('check', 9, 3.2)}</span>${done ? c.done : 'Pending'}</button>
      ${i.rating ? `<span class="tile-rating" aria-label="${i.rating} stars">★ ${i.rating}</span>` : ''}
    </div>
  </div>`;
}

function updateGrid() {
  const l = getList(current), wrap = $('#grid-wrap');
  if (!l || !wrap) return;
  const c = cat(l), items = visibleItems(l);
  if (!l.items.length) {
    if (ui.searching || ui.query) { ui.searching = false; ui.query = ''; renderToolbar(); }
    wrap.innerHTML = `<div class="empty">${stackHTML([], c, true)}
      <h2 class="display">Nothing here yet</h2>
      <p>Search for ${c.a} or paste a link, and its cover is added for you.</p>
      <button class="btn-primary" data-act="add">Add ${c.a}</button></div>`;
  } else if (!items.length) {
    wrap.innerHTML = `<p class="hint">${ui.query ? `No ${c.many} match “${esc(ui.query)}”.` : `No ${ui.filter === 'done' ? c.done.toLowerCase() : 'pending'} ${c.many}.`}</p>`;
  } else {
    wrap.innerHTML = `<div class="grid">${items.map(i => tileHTML(i, c)).join('')}</div>`;
  }
  renderHero(l);
  const tb = $('#toolbar');
  if (tb) tb.hidden = !l.items.length;
}

function renderToolbar() {
  const tb = $('#toolbar');
  if (!tb) return;
  const l = getList(current);
  tb.hidden = !(l && l.items.length);
  tb.classList.toggle('searching', ui.searching);
  if (ui.searching) {
    tb.innerHTML = `${icon('search', 20)}<input id="list-q" type="search" placeholder="Search this list" value="${esc(ui.query)}" autocomplete="off" enterkeyhint="search" aria-label="Search this list">
      <button class="tb" data-act="search-close" aria-label="Close search">${icon('x', 20)}</button>`;
    const q = $('#list-q');
    q.focus({ preventScroll: true });
    q.addEventListener('input', () => { ui.query = q.value; updateGrid(); });
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) q.blur(); });
  } else {
    tb.innerHTML = `
      <button class="tb${l && l.sort && l.sort !== 'added' ? ' on' : ''}" data-act="sort" aria-label="Sort">${icon('sort')}</button>
      <button class="tb${ui.query ? ' on' : ''}" data-act="search" aria-label="Search">${icon('search')}</button>`;
  }
}

function toggle(l, id, btn) {
  const it = l.items.find(i => i.id === id);
  if (!it) return;
  it.status = it.status === 'done' ? 'pending' : 'done';
  save();
  const c = cat(l), done = it.status === 'done';
  btn.classList.toggle('is-done', done);
  btn.setAttribute('aria-pressed', done);
  btn.lastChild.textContent = done ? c.done : 'Pending';
  btn.closest('.tile').classList.toggle('is-done', done);
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  if (ui.filter !== 'all') setTimeout(updateGrid, 500); else renderHero(l);
}

function addItem(l, r) {
  const item = { id: uid(), title: r.title, year: r.year || '', sub: r.sub || '', cover: r.cover || '', link: r.link || '', status: 'pending', rating: 0, note: '', added: Date.now() };
  l.items.push(item);
  save(); updateGrid();
  return item;
}
const inList = (l, r) => l.items.some(i => norm(i.title) === norm(r.title) && (!r.year || !i.year || i.year === r.year));

/* ---------- clicks in the main view ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !app.contains(b)) return;
  const l = getList(current), id = b.dataset.id;
  switch (b.dataset.act) {
    case 'new-list': openNewList(); break;
    case 'open-list': homeScroll = scrollY; go('#list-' + id); break;
    case 'home-menu': homeMenu(b); break;
    case 'back': back(); break;
    case 'add': openAdd(l); break;
    case 'open-item': openItem(l, l.items.find(i => i.id === id)); break;
    case 'toggle': toggle(l, id, b); break;
    case 'sort': sortMenu(l, b); break;
    case 'chip': ui.filter = b.dataset.f; updateGrid(); break;
    case 'search': ui.searching = true; renderToolbar(); break;
    case 'search-close': ui.searching = false; ui.query = ''; renderToolbar(); updateGrid(); break;
    case 'share-list': shareList(l); break;
    case 'list-menu': listMenu(l, b); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openMenu) closeMenu();
  else if (sheets.length) sheets[sheets.length - 1].close();
  else if (ui.searching) { ui.searching = false; ui.query = ''; renderToolbar(); updateGrid(); }
});

/* ---------- menus ---------- */
let openMenu = null;
function closeMenu() { if (openMenu) openMenu.close(); }
function menu(anchor, items) {
  closeMenu();
  const hasChk = items.some(i => 'checked' in i);
  const scrim = document.createElement('div'); scrim.className = 'menu-scrim';
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, k) =>
    it.sep ? '<div class="menu-sep"></div>' :
    it.heading ? `<div class="menu-label">${esc(it.heading)}</div>` :
    `<button class="menu-item${it.danger ? ' danger' : ''}" role="menuitem" data-k="${k}">${hasChk ? `<span class="chk">${it.checked ? icon('check', 16, 2.4) : ''}</span>` : ''}<span class="menu-text">${esc(it.label)}</span>${it.icon ? icon(it.icon, 20) : ''}</button>`
  ).join('');
  document.body.append(scrim, m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  const below = r.top < innerHeight / 2;
  const left = Math.max(12, Math.min(r.left + r.width / 2 > innerWidth / 2 ? r.right - mw : r.left, innerWidth - mw - 12));
  const top = Math.max(12, below ? r.bottom + 10 : r.top - mh - 10);
  Object.assign(m.style, { left: left + 'px', top: top + 'px', transformOrigin: `${r.left + r.width / 2 - left}px ${below ? 0 : mh}px` });
  const close = () => { scrim.remove(); m.remove(); openMenu = null; };
  openMenu = { close };
  const opened = Date.now();
  scrim.addEventListener('click', () => { if (Date.now() - opened > 400) close(); });
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    close();
    const a = items[+b.dataset.k].action;
    if (a) a();
  });
}

function sortMenu(l, b) {
  const s = l.sort || 'added';
  menu(b, [{ heading: 'Sort by' }, ...[['added', 'Recently added'], ['title', 'Title'], ['year', 'Year'], ['rating', 'Your rating']]
    .map(([k, label]) => ({ label, checked: s === k, action: () => { l.sort = k; save(); updateGrid(); renderToolbar(); } }))]);
}
function listMenu(l, b) {
  menu(b, [
    { label: 'Rename list', icon: 'pencil', action: async () => {
        const v = await askText({ title: 'Rename list', value: l.name, confirm: 'Save' });
        if (v) { l.name = v; save(); renderList(l); } } },
    { label: 'Change category', icon: 'tag', action: () => menu(b, Object.entries(CATS).map(([k, c]) => ({
        label: c.label, checked: l.category === k, action: () => { l.category = k; save(); renderList(l); } }))) },
    { sep: true },
    { label: 'Delete list', icon: 'trash', danger: true, action: () => {
        if (!confirm(`Delete “${l.name}” and everything in it?`)) return;
        db.lists = db.lists.filter(x => x !== l); save(); back(); } }
  ]);
}
function homeMenu(b) {
  menu(b, [
    { label: 'Export backup', icon: 'download', action: exportBackup },
    { label: 'Import backup', icon: 'upload', action: importBackup }
  ]);
}

/* ---------- sheets ---------- */
const sheets = [];
function sheet({ title = '', left = null, right = null, onRight, onClose, tall = false, x = false, ambient = null }) {
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet-scrim"></div>
    <section class="sheet${tall ? ' tall' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title || 'Details')}">
      ${ambient !== null ? ambientHTML(ambient) : ''}
      <div class="sheet-drag"><div class="grabber"></div>
        <header class="sheet-head">
          <div>${left ? `<button class="text-btn" data-s="close">${esc(left)}</button>` : ''}</div>
          <h2>${esc(title)}</h2>
          <div class="end">${right ? `<button class="text-btn strong" data-s="right">${esc(right)}</button>` : ''}${x ? `<button class="sheet-x" data-s="close" aria-label="Close">${icon('x', 15, 2.6)}</button>` : ''}</div>
        </header></div>
      <div class="sheet-body"></div>
    </section>`;
  document.body.append(w);
  document.body.classList.add('locked');
  const sec = $('.sheet', w), body = $('.sheet-body', w);
  let closed = false;
  const api = {
    body,
    close(instant = false) {
      if (closed) return;
      closed = true;
      sheets.splice(sheets.indexOf(api), 1);
      if (!sheets.length) document.body.classList.remove('locked');
      if (instant) { w.remove(); if (onClose) onClose(); return; }
      w.classList.add('closing');
      sec.style.transition = 'transform .25s ease-in';
      sec.style.transform = 'translateY(105%)';
      setTimeout(() => w.remove(), 260);
      if (onClose) onClose();
    }
  };
  sheets.push(api);
  const opened = Date.now();
  $('.sheet-scrim', w).addEventListener('click', () => { if (Date.now() - opened > 400) api.close(); });
  $('.sheet-head', w).addEventListener('click', e => {
    const t = e.target.closest('[data-s]');
    if (!t) return;
    if (t.dataset.s === 'close') api.close(); else if (onRight) onRight(api);
  });
  // drag the top bar down to dismiss
  const drag = $('.sheet-drag', w);
  let y0 = null, dy = 0;
  drag.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; sec.style.transition = 'none'; drag.setPointerCapture(e.pointerId); });
  drag.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sec.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; if (dy > 110) api.close(); else { sec.style.transition = 'transform .2s'; sec.style.transform = ''; } };
  drag.addEventListener('pointerup', end);
  drag.addEventListener('pointercancel', end);
  return api;
}

function askText({ title, value = '', placeholder = '', confirm: label = 'Save', type = 'text' }) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done) { done = true; res(v); } };
    const s = sheet({ title, left: 'Cancel', right: label, onRight: api => { finish(inp.value.trim()); api.close(); }, onClose: () => finish(null) });
    s.body.innerHTML = `<input class="field" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" enterkeyhint="done" aria-label="${esc(title)}">`;
    const inp = $('input', s.body);
    inp.focus();
    inp.select();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { finish(inp.value.trim()); s.close(); } });
  });
}

function searchFieldHTML(placeholder, value = '') {
  return `<label class="search-field">${icon('search', 18)}
    <input type="search" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="${esc(placeholder)}">
    <button type="button" class="clear" aria-label="Clear search"${value ? '' : ' hidden'}>${icon('xcircle', 18)}</button></label>`;
}
function bindSearch(field, run) {
  const inp = $('input', field), clr = $('.clear', field);
  let t;
  inp.addEventListener('input', () => { clr.hidden = !inp.value; clearTimeout(t); t = setTimeout(() => run(inp.value), 380); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { clearTimeout(t); run(inp.value); inp.blur(); } });
  clr.addEventListener('click', e => { e.preventDefault(); inp.value = ''; clr.hidden = true; run(''); inp.focus(); });
  return inp;
}

/* cover search results grid, shared by "add" and "change cover". Accepts a title or a pasted link. */
function coverSearch(category, out, { onPick, isAdded = () => false, plain = null, hint }) {
  const c = CATS[category] || CATS.other;
  let ctrl = null, seq = 0, results = [], plainTitle = '';
  out.addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (b) { onPick(results[+b.dataset.k], b); return; }
    if (e.target.closest('[data-plain]') && plain) plain(plainTitle);
  });
  const meta = r => [r.year, r.sub && !(r.year && r.sub.includes(r.year)) ? r.sub : ''].filter(Boolean).join(', ');
  const card = (r, k, m) => `
    <button class="result${isAdded(r) ? ' added' : ''}" data-k="${k}">
      <span class="cover">${coverHTML(r, c)}<span class="badge">${icon('check', 14, 3)}</span></span>
      <span class="r-title">${esc(r.title || 'Untitled')}</span><span class="r-meta">${esc(m)}</span>
    </button>`;
  const grid = (list, from) => `<div class="grid results-grid" style="--ratio:${c.ratio}">${list.map((r, k) => card(r, k + from, meta(r))).join('')}</div>`;
  return async function run(q) {
    q = q.trim();
    if (ctrl) ctrl.abort();
    const my = ++seq;
    if (!q) { out.innerHTML = `<p class="hint">${esc(hint)}</p>`; return; }
    ctrl = new AbortController();
    const signal = ctrl.signal;
    out.innerHTML = '<div class="spinner" role="status" aria-label="Searching"></div>';
    const href = findLink(q);
    let fromUrl = null, linkFailed = false, searchQ = q, failed = false, found = [];
    if (href) {
      try { fromUrl = await fromLink(href, signal); } catch (e) { if (e.name === 'AbortError') return; linkFailed = true; }
      if (my !== seq) return;
      searchQ = fromUrl ? fromUrl.title : '';
    }
    if (searchQ) {
      try { found = await findCovers(category, searchQ, signal); } catch (e) { if (e.name === 'AbortError') return; failed = true; }
    }
    if (my !== seq) return;
    plainTitle = searchQ;
    let html = '';
    if (href) {
      const linked = fromUrl && fromUrl.cover ? fromUrl : null;
      results = linked ? [linked, ...found.filter(r => r.cover !== linked.cover)] : found;
      html += linked
        ? `<p class="section-label">From ${esc(fromUrl.host)}</p><div class="grid results-grid" style="--ratio:${c.ratio}">${card(linked, 0, fromUrl.year || fromUrl.host)}</div>`
        : `<p class="hint">${linkFailed || !fromUrl ? 'That link couldn’t be read. Try typing the title instead.' : `No cover found on ${esc(fromUrl.host)}.`}</p>`;
      const rest = results.slice(linked ? 1 : 0);
      if (rest.length) html += `<p class="section-label">More covers for “${esc(searchQ)}”</p>` + grid(rest, linked ? 1 : 0);
    } else {
      results = found;
      html = found.length ? grid(found, 0)
        : `<p class="hint">${failed ? 'Cover search isn’t reachable right now. Check your connection and try again.' : `No covers found for “${esc(q)}”. Try a shorter title.`}</p>`;
    }
    if (plain && plainTitle) html += `<button class="add-plain" data-plain>${icon('plus', 20)}<span>Add “${esc(plainTitle)}” without a cover</span></button>`;
    out.innerHTML = html;
  };
}

/* ---------- new list ---------- */
function openNewList() {
  let chosen = 'movie';
  const create = api => {
    const name = $('#nl-name', api.body).value.trim() || CATS[chosen].label;
    const l = { id: uid(), name, category: chosen, sort: 'added', created: Date.now(), items: [] };
    db.lists.push(l); save();
    go('#list-' + l.id);
    // Open "Add" only if you're still looking at this list.
    setTimeout(() => { if (current === l.id && !sheets.length) openAdd(l); }, 350);
  };
  const s = sheet({ title: 'New list', left: 'Cancel', right: 'Create', onRight: create });
  s.body.innerHTML = `
    <input class="field big" id="nl-name" placeholder="${CATS[chosen].label}" autocomplete="off" maxlength="60" enterkeyhint="done" aria-label="List name">
    <p class="field-label">Category</p>
    <div class="cats">${Object.entries(CATS).map(([k, c]) => `<button class="cat" style="${catVars(k)}" data-cat="${k}" aria-pressed="${k === chosen}"><span class="swatch">${icon(c.icon, 22, 1.8)}</span><span>${c.label}</span></button>`).join('')}</div>
    <p class="field-help">The category decides where covers are found.</p>`;
  const name = $('#nl-name', s.body);
  name.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) create(s); });
  s.body.addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    chosen = b.dataset.cat;
    s.body.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b));
    name.placeholder = CATS[chosen].label;
  });
}

/* ---------- add items ---------- */
function openAdd(l) {
  if (!l) return;
  const c = cat(l);
  const s = sheet({ title: `Add ${c.one}`, x: true, tall: true });
  s.body.innerHTML = `<div class="sticky-top">${searchFieldHTML('Search or paste a link')}</div><div class="results"></div>`;
  const out = $('.results', s.body);
  const run = coverSearch(l.category, out, {
    hint: `Type a title, or paste a link to ${c.a} from IMDb, Steam, Letterboxd, Goodreads or anywhere else. Tap a result to add it with its cover.`,
    isAdded: r => r.title && inList(l, r),
    onPick: async (r, el) => {
      if (!r.title) {
        const t = await askText({ title: `Name this ${c.one}`, placeholder: 'Title', confirm: 'Add' });
        if (!t) return;
        r = { ...r, title: t };
      }
      if (inList(l, r)) { toast(`${r.title} is already in this list`); return; }
      addItem(l, r); el.classList.add('added'); toast(`Added ${r.title}`);
    },
    plain: q => {
      if (!q) return;
      addItem(l, { title: q }); toast(`Added ${q}`);
      inp.value = ''; run(''); inp.focus();
    }
  });
  const inp = bindSearch($('.search-field', s.body), run);
  run('');
  inp.focus({ preventScroll: true });
}

/* ---------- item detail ---------- */
function openItem(l, item) {
  if (!item) return;
  const c = cat(l);
  let saveTimer;
  const commit = () => {
    clearTimeout(saveTimer);
    const t = title.value.trim();
    if (t) item.title = t;
    item.note = note.value;
    save(); updateGrid();
  };
  const commitSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(commit, 400); };
  const s = sheet({ x: true, title: '', ambient: item.cover || '', onClose: () => commit() });
  const metaHTML = () => `${item.year ? `<span>${esc(item.year)}</span>` : ''}${item.sub && !(item.year && item.sub.includes(item.year)) ? `<span>${esc(item.sub)}</span>` : ''}`;
  const others = db.lists.filter(x => x !== l);
  s.body.innerHTML = `<div class="detail" style="--ratio:${c.ratio}">
    <button class="cover detail-cover" data-d="cover" aria-label="Change cover">${coverHTML(item, c, 40)}</button>
    <textarea class="detail-title" rows="1" aria-label="Title" maxlength="160" enterkeyhint="done">${esc(item.title)}</textarea>
    <p class="detail-meta">${metaHTML()}</p>
    <div class="segmented" role="group" aria-label="Status">
      <button class="seg" data-d="pending" aria-pressed="${item.status !== 'done'}">Pending</button>
      <button class="seg" data-d="done" aria-pressed="${item.status === 'done'}">${icon('check', 15, 2.4)}${c.done}</button>
    </div>
    <div class="stars" role="group" aria-label="Your rating">${[1, 2, 3, 4, 5].map(n => `<button class="star${item.rating >= n ? ' on' : ''}" data-d="star" data-n="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">${icon('star', 26, 1.6)}</button>`).join('')}</div>
    <textarea class="note" placeholder="Add a note" rows="3" aria-label="Note">${esc(item.note)}</textarea>
    <div class="group">
      ${safeLink(item.link) ? `<a class="row" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer">${icon('link', 20)}Open ${esc(hostOf(item.link) || 'link')}</a>` : ''}
      <button class="row" data-d="cover">${icon('image', 20)}Change cover</button>
      ${others.length ? `<button class="row" data-d="move">${icon('move', 20)}Move to another list</button>` : ''}
      <button class="row danger" data-d="delete">${icon('trash', 20)}Delete ${c.one}</button>
    </div></div>`;
  const B = s.body;
  const refreshCover = () => {
    $('.detail-cover', B).innerHTML = coverHTML(item, c, 40); $('.detail-meta', B).innerHTML = metaHTML();
    const amb = s.body.parentNode.querySelector('.ambient');
    if (amb) amb.outerHTML = ambientHTML(item.cover);
  };

  const title = $('.detail-title', B);
  const note = $('.note', B);
  const fit = () => { title.style.height = 'auto'; title.style.height = title.scrollHeight + 'px'; };
  requestAnimationFrame(fit);
  title.addEventListener('input', () => { fit(); commitSoon(); });
  title.addEventListener('blur', () => { commit(); title.value = item.title; fit(); });
  title.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); title.blur(); } });
  note.addEventListener('input', commitSoon);
  note.addEventListener('blur', commit);

  B.addEventListener('click', e => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    const d = b.dataset.d;
    if (d === 'pending' || d === 'done') {
      item.status = d; save(); updateGrid();
      B.querySelectorAll('.seg').forEach(x => x.setAttribute('aria-pressed', x.dataset.d === d));
    } else if (d === 'star') {
      const n = +b.dataset.n;
      item.rating = item.rating === n ? 0 : n; save(); updateGrid();
      B.querySelectorAll('.star').forEach(x => x.classList.toggle('on', item.rating >= +x.dataset.n));
    } else if (d === 'cover') {
      openCoverPicker(l, item, () => { refreshCover(); updateGrid(); });
    } else if (d === 'move') {
      menu(b, [{ heading: 'Move to' }, ...others.map(t => ({ label: t.name, action: () => {
        l.items = l.items.filter(i => i !== item); t.items.push(item); save(); updateGrid(); s.close(); toast(`Moved to ${t.name}`);
      } }))]);
    } else if (d === 'delete') {
      if (!confirm(`Delete “${item.title}”?`)) return;
      l.items = l.items.filter(i => i !== item); save(); updateGrid(); s.close();
    }
  });
}

/* ---------- change cover ---------- */
function openCoverPicker(l, item, onDone) {
  const c = cat(l);
  const s = sheet({ title: 'Change cover', x: true, tall: true });
  s.body.innerHTML = `<div class="sticky-top">${searchFieldHTML('Search or paste a link', item.title)}</div>
    <div class="group cover-actions">
      <label class="row">${icon('upload', 20)}Upload a photo<input type="file" accept="image/*" hidden></label>
      <button class="row" data-c="url">${icon('link', 20)}Paste a link</button>
      ${item.cover ? `<button class="row danger" data-c="remove">${icon('trash', 20)}Remove cover</button>` : ''}
    </div>
    <div class="results"></div>`;
  const set = (url, extra = {}) => {
    const prev = { ...item };
    Object.assign(item, extra, { cover: url });
    if (!save()) { Object.assign(item, prev); return; }
    onDone(); s.close();
    toast(url ? 'Cover updated' : 'Cover removed');
  };
  const run = coverSearch(l.category, $('.results', s.body), {
    hint: 'Search by title, or paste a link to the page or image.',
    onPick: r => set(r.cover, { ...((!item.year && r.year) ? { year: r.year } : {}), ...(r.link && !item.link ? { link: r.link } : {}) })
  });
  bindSearch($('.search-field', s.body), run);
  run(item.title);
  $('input[type=file]', s.body).addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { set(await shrinkImage(f)); } catch { toast('That image couldn’t be read'); }
  });
  s.body.addEventListener('click', async e => {
    const b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'remove') set('');
    else {
      const v = await askText({ title: 'Paste a link', placeholder: 'Page or image link', confirm: 'Get cover', type: 'url' });
      if (!v) return;
      const href = findLink(v);
      if (!href) { toast('That doesn’t look like a link'); return; }
      toast('Reading link…');
      try {
        const r = await fromLink(href);
        if (r.cover) set(r.cover, r.link && !item.link ? { link: r.link } : {});
        else toast(`No cover found on ${r.host}`);
      } catch { toast('That link couldn’t be read'); }
    }
  });
}

function shrinkImage(file, max = 640) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------- share, backup ---------- */
async function shareList(l) {
  const text = `${l.name}\n\n` + visibleItems(l, true).map(i => `${i.status === 'done' ? '✓' : '○'} ${i.title}${i.year ? ` (${i.year})` : ''}`).join('\n');
  if (navigator.share) { try { await navigator.share({ title: l.name, text }); } catch {} return; }
  try { await navigator.clipboard.writeText(text); toast('List copied'); } catch { toast('Sharing isn’t available in this browser'); }
}
async function exportBackup() {
  const name = `listy-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify({ app: 'listy', version: 1, exported: new Date().toISOString(), lists: db.lists })], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Listy backup' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Backups are plain JSON, so check every field before trusting it.
const safeId = id => (typeof id === 'string' && /^\w{1,40}$/.test(id) ? id : uid());
const safeLink = u => (typeof u === 'string' && /^https?:\/\//i.test(u) ? u : '');
const safeCover = u => (typeof u === 'string' && /^(https?:\/\/|data:image\/)/i.test(u) ? u : '');
const cleanItem = i => ({
  id: safeId(i.id), title: String(i.title).slice(0, 160), year: yr(i.year), sub: String(i.sub || '').slice(0, 200),
  cover: safeCover(i.cover), link: safeLink(i.link), status: i.status === 'done' ? 'done' : 'pending',
  rating: Math.min(5, Math.max(0, Math.round(+i.rating) || 0)), note: String(i.note || ''), added: +i.added || Date.now()
});
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json'; inp.hidden = true;
  document.body.append(inp);
  inp.addEventListener('cancel', () => inp.remove());
  inp.onchange = async () => {
    inp.remove();
    try {
      const d = JSON.parse(await inp.files[0].text());
      const lists = Array.isArray(d) ? d : d.lists;
      if (!Array.isArray(lists)) throw 0;
      let n = 0;
      for (const l of lists) {
        if (!l || typeof l.name !== 'string' || !Array.isArray(l.items)) continue;
        const items = l.items.filter(i => i && i.title).map(cleanItem);
        const existing = getList(l.id);
        if (existing) {
          const ids = new Set(existing.items.map(i => i.id));
          existing.items.push(...items.filter(i => !ids.has(i.id)));
        } else {
          db.lists.push({ id: safeId(l.id), name: l.name.slice(0, 60), category: CATS[l.category] ? l.category : 'other',
            sort: ['added', 'title', 'year', 'rating'].includes(l.sort) ? l.sort : 'added', created: +l.created || Date.now(), items });
        }
        n++;
      }
      save(); route();
      toast(`Imported ${n} list${n === 1 ? '' : 's'}`);
    } catch { toast('That file isn’t a Listy backup'); }
  };
  inp.click();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- no pinch or double-tap zoom, like a native app ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* ---------- iPhone home-screen gap ---------- */
// Installed on the home screen with a see-through status bar, iOS ends the app's area early,
// leaving a strip at the bottom where "bottom: 0" doesn't reach. Measure it so popups and
// bottom buttons can extend to the real edge of the screen.
function measureGap() {
  if (!navigator.standalone || !/iPhone|iPod/.test(navigator.userAgent)) return;
  if (document.activeElement && document.activeElement.matches('input, textarea')) return; // keyboard can skew the numbers
  const landscape = matchMedia('(orientation: landscape)').matches;
  const screenH = landscape ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
  const gap = Math.round(screenH - innerHeight);
  document.documentElement.style.setProperty('--gap', (gap > 0 && gap <= 100 ? gap : 0) + 'px');
}
measureGap();
addEventListener('resize', measureGap);
addEventListener('orientationchange', () => setTimeout(measureGap, 300));

/* ---------- boot ---------- */
route();
addEventListener('load', () => {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch { /* service workers are blocked in sandboxed frames */ }
});
if (!storageOK) setTimeout(() => toast('Preview mode: changes won’t be saved'), 600);
</script>
